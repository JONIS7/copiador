<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lider chamados</title>
  <style>
    body { font-family: sans-serif; max-width: 760px; margin: 32px auto; padding: 0 20px; color: #202124; }
    h1 { font-size: 22px; margin: 0 0 20px; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    label { display: block; font-weight: 600; font-size: 13px; }
    input { width: 100%; box-sizing: border-box; margin-top: 5px; padding: 9px; border: 1px solid #9aa0a6; border-radius: 4px; font: inherit; }
    .actions { display: flex; justify-content: flex-end; margin-top: 20px; }
    button { border: 0; border-radius: 4px; background: #1769aa; color: white; padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; }
    @media (max-width: 560px) { body { margin-top: 20px; } .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Lider chamados</h1>
  <form id="liderProfileForm">
    <div class="fields">
      <label>Nome Solicitante<input name="requester" type="text"></label>
      <label>Telefone 1<input name="phone1" type="text"></label>
      <label>Telefone 2<input name="phone2" type="text"></label>
      <label>E-mail<input name="email" type="email"></label>
      <label>Empresa / Órgão<input name="organization" type="text"></label>
      <label>CNPJ<input name="cnpj" type="text"></label>
      <label>Nº Nota Fiscal<input name="invoiceNumber" type="text"></label>
    </div>
    <div class="actions">
      <button type="submit">Salvar dados recorrentes</button>
    </div>
  </form>
  <script src="lider.js"></script>
</body>
</html>
